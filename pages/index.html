<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portelo — Vaš stambeni portal</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .landing {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .landing__logo {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: var(--ink);
      margin-bottom: 8px;
    }

    .landing__tagline {
      color: var(--muted);
      font-size: 1rem;
      margin-bottom: 48px;
    }

    .building-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      width: 100%;
      max-width: 640px;
      margin-bottom: 40px;
    }

    .building-card {
      background: var(--card);
      border: 1.5px solid var(--line);
      border-radius: 16px;
      padding: 32px 24px;
      cursor: pointer;
      transition: box-shadow 0.18s, border-color 0.18s, transform 0.12s;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
      font-family: inherit;
      font-size: inherit;
      background: var(--card);
    }

    .building-card:hover {
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      transform: translateY(-2px);
    }

    .building-card--gce:hover { border-color: var(--accent-gce); }
    .building-card--ch:hover { border-color: var(--accent-ch); }

    .building-card__logo {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
      font-weight: 900;
    }

    .building-card--gce .building-card__logo {
      background: #e4f1ea;
      color: var(--accent-gce);
    }

    .building-card--ch .building-card__logo {
      background: var(--soft-ch);
      color: var(--accent-ch);
    }

    .building-card__name {
      font-weight: 700;
      font-size: 1rem;
      color: var(--ink);
    }

    .building-card__desc {
      font-size: 0.8125rem;
      color: var(--muted);
      line-height: 1.4;
    }

    .building-card__cta {
      margin-top: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .building-card--gce .building-card__cta { color: var(--accent-gce); }
    .building-card--ch .building-card__cta { color: var(--accent-ch); }

    .admin-link {
      font-size: 0.8125rem;
      color: var(--muted);
    }
    .admin-link a {
      color: var(--muted);
      border-bottom: 1px solid var(--line);
    }
    .admin-link a:hover { color: var(--ink); }

    /* Sub-selection view */
    .ch-group-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .ch-group-header__badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--soft-ch);
      border-radius: 50px;
      padding: 6px 14px 6px 8px;
    }

    .ch-group-header__icon {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: var(--accent-ch);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 0.9rem;
    }

    .ch-group-header__label {
      font-weight: 600;
      font-size: 0.875rem;
      color: var(--accent-ch);
    }

    .back-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.875rem;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0;
      margin-bottom: 20px;
    }
    .back-btn:hover { color: var(--ink); }

    .ch-select-hint {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 20px;
      text-align: center;
    }

    @media (max-width: 480px) {
      .building-grid {
        grid-template-columns: 1fr;
        max-width: 320px;
      }
      .landing__logo { font-size: 2rem; }
    }
  </style>
</head>
<body>
  <main class="landing">
    <div class="landing__logo">Portelo</div>
    <div class="landing__tagline">Vaš stambeni portal</div>

    <!-- Main view: GCE + C&H group -->
    <div id="mainView">
      <div class="building-grid">
        <a href="/login?building=gce" class="building-card building-card--gce">
          <div class="building-card__logo">G</div>
          <div class="building-card__name">Green Comfort Energy</div>
          <div class="building-card__desc">Verifikacija Infostan računa i potrošnja</div>
          <div class="building-card__cta">Odaberi →</div>
        </a>

        <button onclick="showChGroup()" class="building-card building-card--ch">
          <div class="building-card__logo">C</div>
          <div class="building-card__name">C&amp;H Solutions</div>
          <div class="building-card__desc">Pregled računa i istorija plaćanja</div>
          <div class="building-card__cta" style="color:var(--accent-ch)">Odaberi →</div>
        </button>
      </div>

      <div class="admin-link">
        <a href="/admin/login">Admin prijava</a>
      </div>
    </div>

    <!-- Sub-selection view: Zen Hill / Kovačeva -->
    <div id="chGroupView" class="hidden">
      <button class="back-btn" onclick="showMain()">← Nazad na izbor</button>

      <div class="ch-group-header" style="justify-content:center">
        <div class="ch-group-header__badge">
          <div class="ch-group-header__icon">C</div>
          <span class="ch-group-header__label">C&amp;H Solutions</span>
        </div>
      </div>

      <p class="ch-select-hint">Odaberite Vašu zgradu</p>

      <div class="building-grid">
        <a href="/login?building=zh" class="building-card building-card--ch">
          <div class="building-card__logo">Z</div>
          <div class="building-card__name">Zen Hill</div>
          <div class="building-card__desc">Pregled mesečnih troškova i uplata</div>
          <div class="building-card__cta">Odaberi →</div>
        </a>

        <a href="/login?building=kv" class="building-card building-card--ch">
          <div class="building-card__logo">K</div>
          <div class="building-card__name">Kovačeva</div>
          <div class="building-card__desc">Pregled mesečnih troškova i uplata</div>
          <div class="building-card__cta">Odaberi →</div>
        </a>
      </div>

      <div class="admin-link">
        <a href="/admin/login">Admin prijava</a>
      </div>
    </div>
  </main>

  <script>
    function showChGroup() {
      document.getElementById('mainView').classList.add('hidden');
      document.getElementById('chGroupView').classList.remove('hidden');
    }

    function showMain() {
      document.getElementById('chGroupView').classList.add('hidden');
      document.getElementById('mainView').classList.remove('hidden');
    }
  </script>
</body>
</html>
